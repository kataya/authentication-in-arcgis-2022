<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>ArcGIS Developer Guide: Display a map (2D)</title>
    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }

      header {
        margin: 32px;
      }
    </style>

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.32/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.32/"></script>

    <script>
      require([
        "esri/config",
        "esri/Map",
        "esri/views/MapView",
        "esri/Basemap",
        "esri/widgets/Search",
        "esri/widgets/BasemapGallery",
        "esri/widgets/Expand",
        "esri/layers/FeatureLayer",
        "esri/layers/TileLayer",
        "esri/identity/IdentityManager",
        "esri/support/BasemapStyle"
      ], (
        esriConfig,
        Map,
        MapView,
        Basemap,
        Search,
        BasemapGallery,
        Expand,
        FeatureLayer,
        TileLayer,
        IdentityManager,
        BasemapStyle
      ) =>
        (async () => {
          // The URL of our token server
          const appTokenURL = "http://localhost:3080/auth" //"https://local.arcgis.com:3080/auth"

          const tokenData = { nonce: 1234 }

          const tokenRequest = await fetch(appTokenURL, {
            method: "POST",
            body: JSON.stringify(tokenData),
            headers: {
              "Content-Type": "application/json",
            },
          })
          
          if (!tokenRequest.ok) {
            throw new Error(`HTTP error: ${tokenRequest.status}`);
          }
          const tokenResponse = await tokenRequest.json()
          if (tokenResponse.error) {
            throw new Error(tokenResponse.error.message);
          }

          IdentityManager.registerToken({
            expires: tokenResponse.expires_in,
            server: tokenResponse.appTokenBaseURL,
            ssl: true,
            token: tokenResponse.access_token,
            userId: tokenResponse.arcgisUserId,
          })
          
          //debug
          //console.log("registered");
          //console.log(JSON.stringify(IdentityManager.toJSON(), null, 2));
          //BasemapStyle で style id を指定時に 401エラーの発生を回避するために esriConfig.apiKey に token を設定する
          esriConfig.apiKey = tokenResponse.access_token;
          
          //const parcels = new FeatureLayer({
          //  portalItem: {
          //    id: "4e929dbd0c9f4bad845e5ac2a6ed9f31",
          //  },
          //})

          const basemap = new Basemap({
            style: new BasemapStyle({
                id: "arcgis/navigation", // "arcgis/light-gray", "arcgis/navigation", "arcgis/topographic"
                //language: "ja",
            }),
          });
          
          const map = new Map({
            //basemap: "gray-vector",
            //layers: [parcels],
            basemap: basemap,
          })

          const view = new MapView({
            map: map,
            center: [-118.4803, 34.0229],
            zoom: 13, // scale: 36111.909643
            container: "viewDiv",
            constraints: {
              snapToZoom: false,
            },
          })

          await view.when()

          const search = new Search({ view })
          view.ui.add(search, { position: "top-right" })
          

          const basemapGallery = new BasemapGallery({
            view: view
          });
          const bgExpand = new Expand({
            view: view,
            content: basemapGallery,
            expanded: false,
          });
          view.ui.add(bgExpand, { position: "bottom-left" })
          
        })())
    </script>
  </head>

  <body>
    <header>
      <h1>App authentication - Esri Maps SDK for JavaScript (2025-DTS)</h1>
    </header>
    <div id="viewDiv"></div>
  </body>
</html>
